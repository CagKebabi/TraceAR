[package]
name = "tracear-wasm"
version = "0.2.1"
edition = "2021"
license = "MIT"
description = "wasm-bindgen bindings for the Tracear engine core"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
tracear-core = { path = "../tracear-core" }

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3"]
